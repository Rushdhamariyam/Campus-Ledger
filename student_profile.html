<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Ledger - Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="student_profile.css">
</head>
<body>
    <div class="background-orbs"><div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div></div>
    
    <div class="profile-container">
        <nav class="top-nav glass-panel fade-in-up">
            <h1 class="logo-small">CampusLedger</h1>
            <div class="nav-right">
                <a href="student_dashboard.html" class="nav-link">Home</a>
                <a href="tickets.html" class="nav-link">Tickets</a>
                <a href="student_profile.html" class="nav-link active">Profile</a>
                <button id="connect-wallet-btn" style="background: rgba(99, 102, 241, 0.15); border: 1px solid var(--accent-primary); padding: 0.45rem 1.25rem; border-radius: 20px; color: #fff; cursor: pointer; font-family: 'Outfit'; font-weight: 600; margin-left: 0.5rem; transition: all 0.3s ease;">Connect Wallet</button>
            </div>
        </nav>

        <div class="profile-main fade-in-up delay-1">
            <div class="glass-panel profile-info">
                <div class="profile-picture"><span class="big-icon">👨‍🎓</span></div>
                <div class="profile-details">
                    <h2 class="profile-name">User</h2>
                    <p class="profile-department" style="color: var(--text-secondary); font-size: 0.95rem; margin-top: -0.5rem; margin-bottom: 0.5rem;"></p>
                    <div class="wallet-group" style="display: flex; align-items: center; gap: 0.8rem;">
                        <span class="wallet-label">Address:</span>
                        <span class="wallet-address" id="profile-wallet">0x2DF2...EDD4</span>
                        <button class="copy-btn" onclick="copyToClipboard()" style="background:none; border:none; cursor:pointer; font-size:1.1rem; color:var(--text-secondary); transition:color 0.2s;" title="Copy Wallet Address">📋</button>
                    </div>
                    <button class="logout-btn-minimal" onclick="logoutUser()">
                        <span class="logout-icon">🚪</span> Logout
                    </button>
                </div>
                <div class="qr-section">
                    <img src="assets/qr-placeholder.png" alt="QR" class="qr-placeholder qr-code">
                    <span class="qr-icon">Scan</span>
                </div>
            </div>

            <div class="glass-panel vertical-stats-banner fade-in-up delay-2">
                <div class="stats-left-stack" style="display: flex; flex-direction: column; gap: 1rem;">
                    <div class="stat-card" style="display: flex; align-items: center; gap: 0.5rem;">
                        <h3 style="margin: 0; font-size:0.95rem; font-weight:600; color:var(--text-secondary);">Total Earned:</h3>
                        <span class="stat-value text-accent" id="total-earned" style="font-size:1.1rem; font-weight:700;">0 CTK</span>
                    </div>
                    <div class="stat-card" style="display: flex; align-items: center; gap: 0.5rem;">
                        <h3 style="margin: 0; font-size:0.95rem; font-weight:600; color:var(--text-secondary);">Total Spent:</h3>
                        <span class="stat-value text-danger" id="total-spent" style="font-size:1.1rem; font-weight:700;">0 CTK</span>
                    </div>
                </div>
                <div class="stats-right-balance">
                    <span class="balance-label">Current Balance</span>
                    <span class="balance-amount text-accent" style="font-weight: bold; font-size: 1.4rem;">0 CTK</span>
                </div>
            </div>

            <div class="glass-panel transactions-full-section fade-in-up delay-3">
                <h2 class="section-title">Full Transaction History</h2>
                <div class="scrollable-table-container">
                    <table class="transaction-table data-table">
                        <thead><tr><th>Date</th><th>From</th><th>To</th><th>Amount</th><th>Purpose</th></tr></thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js" type="application/javascript"></script>
    <script src="script.js"></script>
</body>
</html>
