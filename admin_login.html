<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Ledger - Admin Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="student_login.css">
</head>
<body>
    <div class="background-orbs"><div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div></div>
    
    <div class="container">
        <header class="header">
            <h1 class="logo fade-in-up">CampusLedger</h1>
        </header>

        <div class="glass-box login-box fade-in-up delay-1">
            <h2 class="welcome-text">Admin Login</h2>
            <form class="login-form" id="admin-login-form">
                <div class="form-group">
                    <label for="username">Admin Username</label>
                    <input type="text" id="username" placeholder="Enter admin username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>
                <div id="login-error" style="color: #ef4444; font-size: 0.95rem; display: none; text-align: center; margin-bottom: 0.8rem; background: rgba(239, 68, 68, 0.1); padding: 0.5rem; border-radius: 6px; border: 1px solid rgba(239, 68, 68, 0.3);">Invalid credentials</div>
                
                <div class="button-group">
                    <button type="submit" class="btn btn-primary submit-btn">
                        <span class="btn-text">Admin Login</span>
                    </button>
                    <button type="button" class="btn btn-secondary forget-btn">
                        <span class="btn-text">Forget Password?</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Clear any previous wallet connection session on new login attempt
        sessionStorage.removeItem('walletConnected');

        document.getElementById('admin-login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('login-error');
            const submitBtn = document.querySelector('.submit-btn .btn-text');
            
            errorMsg.style.display = 'none';
            submitBtn.innerText = 'Authenticating...';
            
            try {
                const response = await fetch('/api/login/admin', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();
                
                if (data.success) {
                    submitBtn.innerText = 'Success! Redirecting...';
                    window.location.href = data.redirect;
                } else {
                    errorMsg.innerText = data.message;
                    errorMsg.style.display = 'block';
                    submitBtn.innerText = 'Admin Login';
                }
            } catch (err) {
                console.error(err);
                errorMsg.innerText = "Error connecting to server. Is Flask running?";
                errorMsg.style.display = 'block';
                submitBtn.innerText = 'Admin Login';
            }
        });
    </script>
</body>
</html>
